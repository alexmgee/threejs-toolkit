<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagnostics Self-Test | threejs-toolkit</title>
  <link rel="stylesheet" href="../shared/sandbox-styles.css" />
  <style>
    /* sandbox-styles sets a #111 background with no color and hides
       overflow — restore readability and scrolling for the report
       (adversarial review: a FAIL must be visibly distinct). */
    html, body { overflow: auto; }
    body { padding: 24px; color: #ccc; }
    #out pre { white-space: pre-wrap; }
    #out .assertion { margin: 4px 0; padding: 2px 8px; border-left: 3px solid #555; }
    #out .pass { color: #4ade80; border-color: #4ade80; }
    #out .fail { color: #f87171; border-color: #f87171; }
    #out .skip { color: #999; border-color: #999; }
    #out h2.pass { color: #4ade80; }
    #out h2.fail { color: #f87171; }
  </style>
</head>
<body>
  <h1>diag/dev/selfTest</h1>
  <div id="out"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
