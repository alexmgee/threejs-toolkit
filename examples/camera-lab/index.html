<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>camera-lab — CameraSystem orbit/recenter parity (ticket 10)</title>
  <link rel="stylesheet" href="../shared/sandbox-styles.css" />
  <style>
    html, body { overflow: auto; }
    body { padding: 280px 24px 24px; color: #ccc; }
    /* Pinned CSS size AND integer page position: OrbitControls scales drags
       by the canvas client height, the pixel readbacks sample the drawing
       buffer, and a synthetic MouseEvent truncates clientX/clientY to
       integers — a canvas at a fractional offset (e.g. below a heading whose
       height depends on font rendering) would move the double-click point
       between page loads. */
    #viewer { position: fixed; left: 0; top: 0; width: 512px; height: 256px; }
    #out .assertion { margin: 4px 0; padding: 2px 8px; border-left: 3px solid #555; }
    #out .pass { color: #4ade80; border-color: #4ade80; }
    #out .fail { color: #f87171; border-color: #f87171; }
    #out h2.pass { color: #4ade80; }
    #out h2.fail { color: #f87171; }
    #capture { white-space: pre-wrap; word-break: break-all; font-size: 11px; color: #999; }
  </style>
</head>
<body>
  <h1>camera-lab — CameraSystem orbit/recenter parity (ticket 10)</h1>
  <div id="viewer"></div>
  <div id="out"></div>
  <pre id="capture"></pre>
  <script type="module" src="./main.ts"></script>
</body>
</html>
