<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hload — Phase 2 H-LOAD trial harness (ticket 13)</title>
  <style>
    html, body { margin: 0; background: #111; color: #ccc; font: 13px/1.5 ui-monospace, monospace; }
    /* Ruling H3 fallback: the element in a FIXED 1280x720 CSS box (pixel ratio pinned to 1 in
       main.ts), so logical and drawing-buffer sizes agree across trials (doc 05). */
    #viewer { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
    splat-site { display: block; width: 100%; height: 100%; }
    #hud {
      position: absolute; left: 8px; top: 8px; max-width: 1264px; z-index: 10;
      white-space: pre-wrap; pointer-events: none;
      background: rgba(0, 0, 0, 0.6); padding: 6px 8px;
    }
  </style>
  <script>
    // The dev server serves every module as its own request; the default 250-entry resource
    // buffer could fill before the hero's 123 range requests, and the cold-cache proof must
    // never read a truncated list — raised before any module loads.
    performance.setResourceTimingBufferSize(5000);
    // Ticket 09 Stop 11 / examples/site-lab/element.html: `?webgl=1` hides navigator.gpu before
    // any toolkit module loads, so a WebGPU-capable browser takes the fallback path a visitor
    // without WebGPU would.
    if (new URLSearchParams(location.search).get("webgl") === "1") {
      Object.defineProperty(navigator, "gpu", { value: undefined, configurable: true });
    }
  </script>
</head>
<body>
  <div id="viewer"></div>
  <div id="hud">hload — booting…</div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
