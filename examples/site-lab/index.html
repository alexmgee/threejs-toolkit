<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>site-lab — SiteRuntime on a real site.json (ticket 09)</title>
  <link rel="stylesheet" href="../shared/sandbox-styles.css" />
  <style>
    html, body { overflow: auto; }
    body { padding: 300px 24px 24px; color: #ccc; }
    /* Pinned CSS size so pixel readbacks and marker hit-tests are stable. */
    #viewer { position: fixed; left: 0; top: 0; width: 512px; height: 256px; }
    #out .assertion { margin: 4px 0; padding: 2px 8px; border-left: 3px solid #555; }
    #out .pass { color: #4ade80; border-color: #4ade80; }
    #out .fail { color: #f87171; border-color: #f87171; }
    #out h2.pass { color: #4ade80; }
    #out h2.fail { color: #f87171; }
  </style>
  <script>
    // Ticket 09 Stop 11: reach the WebGL2 backend the way a visitor without
    // WebGPU does — hide navigator.gpu BEFORE any toolkit module loads, so
    // three's own fallback selects WebGL2 inside renderer.init(). The runtime
    // and the element take no renderer option, by design. Deliberately
    // DIFFERENT coverage from the other labs' construction-time forceWebGL.
    if (new URLSearchParams(location.search).get("webgl") === "1") {
      Object.defineProperty(navigator, "gpu", { value: undefined, configurable: true });
    }
  </script>
</head>
<body>
  <h1>site-lab — SiteRuntime on a real site.json (ticket 09)</h1>
  <div id="viewer"></div>
  <div id="out"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
